x-application: &application
  env_file: .env

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: answer_controller
      POSTGRES_USER: answer
      POSTGRES_PASSWORD: answer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U answer -d answer_controller"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *application
    build: .
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *application
    build: .
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    <<: *application
    build: .
    command: taskiq worker answer_controller.boot.worker:broker
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *application
    build: .
    command: taskiq scheduler answer_controller.boot.worker:scheduler answer_controller.boot.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      worker:
        condition: service_started

volumes:
  postgres-data:
