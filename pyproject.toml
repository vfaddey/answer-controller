[project]
name = "answer-controller"
version = "0.1.0"
description = "Service for tracking customer response SLA"
readme = "README.md"
authors = [
    { name = "vfaddey", email = "vfaddey@yandex.ru" }
]
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.19.1",
    "asyncpg>=0.30.0",
    "dishka>=1.10.1",
    "fastapi>=0.141.1",
    "greenlet>=3.5.5",
    "pydantic-settings>=2.10.0",
    "ruff>=0.16.2",
    "sqlalchemy>=2.0.52",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.1.2",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "testcontainers[postgres]>=4.10.0",
]

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
